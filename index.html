<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hussain Kiryana - Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#128C7E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --primary-color: #128C7E; --light-gray: #f0f2f5; --danger-color: #e74c3c; }
        body { font-family: -apple-system, sans-serif; background-color: var(--light-gray); margin: 0; padding: 15px; }
        .container { width: 100%; max-width: 800px; margin: auto; padding-top: 60px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header i { font-size: 3rem; color: var(--primary-color); }
        .header h1 { color: var(--primary-color); margin: 10px 0 0; font-size: 1.75rem; }
        .header p { font-size: 1rem; color: #555; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .dashboard-card { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); text-decoration: none; color: #333; transition: transform 0.2s; text-align: center; }
        .dashboard-card:hover { transform: translateY(-5px); }
        .dashboard-card i { font-size: 2.25rem; color: var(--primary-color); margin-bottom: 15px; }
        .dashboard-card h2 { margin: 0; font-size: 1.125rem; }
        #logout-btn { position: fixed; top: 15px; right: 15px; background-color: var(--danger-color); color: #fff; border: none; border-radius: 8px; padding: 10px 15px; cursor: pointer; font-weight: bold; z-index: 10; }
        @media (min-width: 600px) { .dashboard-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <button id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    <div class="container">
        <header class="header"> <i class="fas fa-store"></i> <h1>Hussain Kiryana</h1> <p>Aapke Business ka Digital Khata</p> </header>
        <main class="dashboard-grid">
            <a href="invoice.html" class="dashboard-card"> <i class="fas fa-file-invoice-dollar"></i> <h2>Naya Invoice Banayein</h2> </a>
            <a href="history.html" class="dashboard-card"> <i class="fas fa-history"></i> <h2>Customer History</h2> </a>
            <a href="manage_customers.html" class="dashboard-card"> <i class="fas fa-users-cog"></i> <h2>Customer Management</h2> </a>
            <a href="reports.html" class="dashboard-card"> <i class="fas fa-chart-line"></i> <h2>Business Reports</h2> </a>
            <a href="settings.html" class="dashboard-card"> <i class="fas fa-cog"></i> <h2>App Settings</h2> </a>
        </main>
    </div>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFbFrsnRiS9oSN1BKYerFRUmWpPPHhmOY", authDomain: "sms92-app.firebaseapp.com",
      projectId: "sms92-app", storageBucket: "sms92-app.appspot.com",
      messagingSenderId: "572539460293", appId: "1:572539460293:web:0258625e888c8c4772eeac"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.onAuthStateChanged(user => { if (!user) window.location.replace('/login.html'); });
    document.getElementById('logout-btn').addEventListener('click', async () => { if (confirm("Kya aap waqai logout karna chahte hain?")) await auth.signOut(); });
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
        });
    }
</script>
</body>
</html>
